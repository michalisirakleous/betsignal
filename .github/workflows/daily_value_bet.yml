name: Daily Value Bet Signal

on:
  schedule:
    # 3 προσπάθειες/μέρα ως ασφάλεια — το GitHub καμιά φορά καθυστερεί ή
    # χάνει scheduled runs (γνωστό ζήτημα, όχι κάτι που φταίει ο κώδικάς μας).
    # Ο agent στέλνει μήνυμα ΜΟΝΟ την πρώτη επιτυχημένη φορά κάθε μέρα
    # (βλέπε state/last_run_date.txt) — οι άλλες 2 απλά τερματίζουν χωρίς
    # να στείλουν τίποτα, άρα δεν παίρνεις διπλά μηνύματα.
    - cron: "5 6 * * *"    # 09:05 Cyprus time (EEST, UTC+3)
    - cron: "5 7 * * *"    # 10:05 Cyprus time — 2η προσπάθεια
    - cron: "5 8 * * *"    # 11:05 Cyprus time — 3η προσπάθεια
  workflow_dispatch: {}     # επιτρέπει manual run από το tab Actions

permissions:
  contents: write   # χρειάζεται για να αποθηκεύει το state/last_run_date.txt πίσω στο repo

jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run value-bet agent
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python value_bet_agent.py

      - name: Save state back to repo (already-sent marker + pick history/calibration)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update state (daily marker + pick history/calibration)"
          git pull --rebase origin main
          git push
        continue-on-error: true   # αν αποτύχει το commit, δεν μπλοκάρει το job